<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메이플 타임 스케줄러</title>
<style>
  :root {
    --bg: #FBEFD9;
    --surface: #FFF8EA;
    --ink: #4A3520;
    --muted: #8B6F4E;
    --border: #E3C68B;
    --accent: #FF9F1C;
    --accent-strong: #E67E00;
    --accent-soft: rgba(255,159,28,0.16);
    --success: #4C9F70;
    --success-soft: rgba(76,159,112,0.16);
    --danger: #D64545;
    --track: #F0DFB8;
    --shadow: 0 2px 0 var(--border), 0 10px 24px rgba(74,53,32,0.10);
    --theme-daily: #FF9F1C;
    --theme-weekly: #4C9F70;
    --theme-monthly: #4C7FD6;
    --theme-memo: #C99A2E;
    --time-grad-1: #3B6FD1;
    --time-grad-2: #7FB2FF;
    --time-grad-pale: #A7BEEA;
    --money-grad-1: #D9A400;
    --money-grad-2: #4C9F70;
    --money-grad-pale: #EED68C;
  }
  [data-theme="dark"] {
    --bg: #18171C;
    --surface: #211F26;
    --ink: #F0EAE0;
    --muted: #9C9894;
    --border: #35333A;
    --accent: #FFB443;
    --accent-strong: #FFC968;
    --accent-soft: rgba(255,180,67,0.16);
    --success: #6FCB9F;
    --success-soft: rgba(111,203,159,0.16);
    --danger: #E8807A;
    --track: #2A282E;
    --shadow: 0 2px 0 var(--border), 0 10px 26px rgba(0,0,0,0.5);
    --theme-daily: #FFB25C;
    --theme-weekly: #7FD9A8;
    --theme-monthly: #8FAEFF;
    --theme-memo: #E8D07A;
    --time-grad-1: #6FA3FF;
    --time-grad-2: #A9CBFF;
    --time-grad-pale: #B0CCFF;
    --money-grad-1: #FFC94D;
    --money-grad-2: #6FCB9F;
    --money-grad-pale: #FFE19D;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .coin-icon { vertical-align: -0.15em; margin-right: 1px; }
  .clock-icon { vertical-align: -0.15em; margin-right: 1px; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--bg);
    color: var(--ink);
    font-family: '맑은 고딕', 'Malgun Gothic', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease;
    min-height: 100vh;
  }
  .app { width: 100%; max-width: 1080px; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; padding: 14px 4px 22px; gap: 16px; border-bottom: 1px solid var(--border); }
  .header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-title .icon { flex-shrink: 0; }
  .header-title h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; min-width: 60px; }

  .theme-toggle {
    position: relative; width: 56px; height: 30px; border-radius: 999px;
    background: var(--track); border: 2px solid var(--border); cursor: pointer; flex-shrink: 0;
  }
  .theme-toggle .knob {
    position: absolute; top: 1px; left: 1px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: transform 0.25s ease, background 0.25s ease;
  }
  [data-theme="dark"] .theme-toggle .knob { transform: translateX(26px); }

  .card { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }

  /* Character panel */
  .char-card { padding: 14px 16px; margin-bottom: 16px; }
  .char-card-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: baseline; gap: 6px; }
  .char-card-count { font-size: 11.5px; font-weight: 400; color: var(--muted); }
  .char-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
  @media (max-width: 900px) { .char-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 600px) { .char-grid { grid-template-columns: repeat(3, 1fr); } }
  .char-grid-item {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 14px 3px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
    min-width: 0; box-sizing: border-box;
  }
  .char-grid-actions { position: absolute; top: 3px; right: 3px; display: flex; gap: 0px; }
  .char-icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; line-height: 1; padding: 2px; flex-shrink: 0; }
  .char-icon-btn:hover { color: var(--accent-strong); }
  .char-icon-danger:hover { color: var(--danger); }
  .char-avatar-wrap { position: relative; margin-top: 4px; }
  .char-avatar {
    width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    background: var(--accent-soft); border: 1px solid var(--border);
  }
  .char-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .char-number-badge {
    position: absolute; bottom: -2px; right: -2px; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent-strong); color: #fff; font-size: 8.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; border: 1px solid var(--surface);
  }
  [data-theme="dark"] .char-number-badge { color: #201404; }
  .char-grid-name { font-size: 11px; font-weight: 700; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-grid-bottom { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 4px; width: 100%; min-width: 0; }
  .char-time-chip {
    font-size: 9.5px; color: var(--muted); background: var(--track); padding: 1px 6px;
    border-radius: 20px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    box-sizing: border-box;
  }
  .char-add-row { display: flex; gap: 6px; }
  .char-add-row input {
    flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--ink); font-size: 13px; font-family: inherit;
  }
  .char-add-row button {
    padding: 8px 14px; background: var(--accent); color: #fff; border: none; border-radius: 7px;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  [data-theme="dark"] .char-add-row button { color: #201404; }
  .char-view-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .char-view-stats { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .char-edit-avatar-row { display: flex; align-items: center; gap: 10px; }
  .char-edit-avatar-actions { display: flex; flex-direction: column; gap: 6px; }
  .char-edit-avatar-actions button { font-size: 11.5px; padding: 6px 10px; }

  .exp-card { padding: 18px 20px; margin-bottom: 22px; }
  .exp-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .exp-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .exp-figure { font-size: 20px; font-weight: 700; color: var(--time-grad-1); }
  .exp-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .exp-track {
    width: 100%; height: 24px; border-radius: 999px; background: var(--track); border: 1px solid var(--border);
    overflow: hidden; position: relative;
    background-image: repeating-linear-gradient(90deg, transparent, transparent calc(10% - 1px), rgba(0,0,0,0.05) 10%);
  }
  [data-theme="dark"] .exp-track { background-image: repeating-linear-gradient(90deg, transparent, transparent calc(10% - 1px), rgba(255,255,255,0.06) 10%); }
  .exp-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, var(--time-grad-pale) 30%, var(--time-grad-1) 100%);
    transition: width 0.4s ease;
  }
  .exp-pct {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 12px; font-weight: 700; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  .money-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .money-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .money-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .money-figure { font-size: 20px; font-weight: 700; color: var(--money-grad-1); }
  .money-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .money-track {
    width: 100%; height: 22px; border-radius: 999px; background: var(--track); border: 1px solid var(--border);
    overflow: hidden; position: relative;
    background-image: repeating-linear-gradient(135deg, transparent, transparent 8px, rgba(255,255,255,0.12) 8px, rgba(255,255,255,0.12) 10px);
  }
  [data-theme="dark"] .money-track { background-image: repeating-linear-gradient(135deg, transparent, transparent 8px, rgba(255,255,255,0.05) 8px, rgba(255,255,255,0.05) 10px); }
  .money-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, var(--money-grad-pale) 30%, var(--money-grad-1) 100%);
    transition: width 0.4s ease;
  }
  .money-pct {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 11.5px; font-weight: 700; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  .theme-section { margin-bottom: 24px; }
  .theme-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .theme-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .theme-section-header h3 { font-size: 15px; font-weight: 700; margin: 0; }
  .theme-badge { font-size: 12px; color: var(--muted); margin-left: 2px; }

  .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .board-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .board-grid { grid-template-columns: 1fr; } }

  .board { display: flex; flex-direction: column; padding: 14px 14px 16px; }
  .board-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .board-name-wrap { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
  .board-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .board-name {
    font-size: 15px; font-weight: 700; outline: none; min-width: 20px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .board-name[contenteditable="true"]:focus { outline: none; white-space: normal; }
  .board-header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .mark-all-btn {
    font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--success-soft); color: var(--success); cursor: pointer; font-weight: 700; white-space: nowrap;
  }
  .mark-all-btn:hover { background: var(--success); color: #fff; }
  .boss-settings-btn {
    font-size: 12px; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; cursor: pointer; line-height: 1;
  }
  .boss-settings-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .board-delete { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; flex-shrink: 0; opacity: 0.7; }
  .board-delete:hover { color: var(--danger); opacity: 1; }

  .board-progress-track { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; margin-bottom: 4px; }
  .board-progress-fill { height: 100%; background: linear-gradient(90deg, var(--time-grad-pale) 30%, var(--time-grad-1) 100%); width: 0%; transition: width 0.3s ease; }
  .board-progress-label { font-size: 11px; color: var(--muted); margin-bottom: 10px; text-align: right; }
  .board-money-track { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; margin-bottom: 4px; }
  .board-money-fill { height: 100%; background: linear-gradient(90deg, var(--money-grad-pale) 30%, var(--money-grad-1) 100%); width: 0%; transition: width 0.3s ease; }
  .board-money-label { font-size: 11px; color: var(--muted); margin-bottom: 10px; text-align: right; }

  .board-tasks { list-style: none; padding: 0; margin: 0 0 6px; flex: 1; }
  .task-item {
    display: flex; align-items: flex-start; justify-content: space-between; padding: 7px 4px;
    gap: 6px; cursor: pointer; border-radius: 6px; transition: opacity 0.12s ease;
  }
  .task-item:hover { background: var(--accent-soft); }
  .task-item.completed .task-text { text-decoration: line-through; color: var(--muted); opacity: 0.45; }
  .task-item.completed .task-text[contenteditable="true"] { text-decoration: none; color: var(--ink); opacity: 1; }
  .task-left { display: flex; align-items: flex-start; gap: 8px; flex: 1 1 auto; min-width: 110px; padding-top: 2px; }
  .task-left input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--success); flex-shrink: 0; cursor: pointer; margin-top: 2px; }
  .task-text { font-size: 13.5px; word-break: break-word; }
  .task-text[contenteditable="true"] {
    outline: none; cursor: text; background: var(--surface);
    border: 1.5px solid var(--accent); border-radius: 6px; padding: 1px 6px;
    box-shadow: 0 0 0 3px var(--accent-soft);
    display: block; width: 100%; box-sizing: border-box;
  }
  .task-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; flex-shrink: 0; width: 112px; }
  .task-char, .task-time {
    font-size: 11px; color: var(--muted); padding: 2px 7px 2px 8px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .task-char {
    background: var(--track);
    border-left: 3px solid var(--chip-accent, var(--accent));
    border-radius: 4px 12px 12px 4px;
  }
  .task-time {
    cursor: pointer; background: transparent; border: 1px dashed var(--border);
    font-variant-numeric: tabular-nums; letter-spacing: 0.2px; padding: 1px 8px;
  }
  .task-time[contenteditable="true"] {
    outline: none; background: var(--surface); cursor: text;
    border: 1.5px solid var(--accent); border-radius: 20px;
    box-shadow: 0 0 0 3px var(--accent-soft);
    display: block; width: 100%; box-sizing: border-box; text-align: center;
  }
  .task-char.chip-placeholder, .task-time.chip-placeholder, .task-boss-total.chip-placeholder { visibility: hidden; pointer-events: none; cursor: default; }
  .task-boss-total {
    font-size: 10.5px; font-weight: 700; color: var(--money-grad-1); background: transparent;
    border: 1px dashed var(--money-grad-1); padding: 1px 7px; border-radius: 20px; white-space: nowrap;
    flex-shrink: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
  }
  .delete-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 0 2px; flex-shrink: 0; line-height: 1; opacity: 0.7; }
  .row-hover-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .row-add-btn {
    background: none; border: none; color: var(--accent-strong); cursor: pointer; font-size: 17px;
    font-weight: 700; padding: 0 4px; flex-shrink: 0; line-height: 1;
  }
  .row-add-btn:hover { color: var(--accent); }
  .empty-state { color: var(--muted); font-size: 12.5px; padding: 6px 0 10px; }

  .board-add-row { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
  .board-add-row input[type="text"] { flex: 1; min-width: 70px; }
  .board-add-row input[type="number"] { width: 52px; }
  .board-add-row select { max-width: 90px; }
  .board-add-row input, .board-add-row select {
    padding: 7px 6px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--ink); font-size: 12px; font-family: inherit;
  }
  .board-add-row button {
    padding: 7px 11px; background: var(--accent); color: #fff; border: none; border-radius: 7px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }
  [data-theme="dark"] .board-add-row button { color: #201404; }
  .board-add-row button:hover { background: var(--accent-strong); }

  .boss-form-toggle {
    background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-strong); font-size: 11.5px; font-weight: 700;
    cursor: pointer; padding: 5px 10px; border-radius: 999px;
  }
  .boss-form-toggle:hover { background: var(--accent); color: #fff; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-card {
    background: var(--surface); border: 2px solid var(--border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 400px; box-shadow: var(--shadow);
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--ink); }
  .modal-warning {
    background: var(--danger); color: #fff; font-size: 12.5px; font-weight: 600;
    padding: 9px 11px; border-radius: 8px; margin-bottom: 12px; line-height: 1.4;
  }
  .modal-field { margin-bottom: 10px; }
  .modal-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .modal-field select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--ink); font-size: 13px; font-family: inherit;
  }
  .boss-icon-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    max-height: 220px; overflow-y: auto; padding: 6px; margin-bottom: 2px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  }
  .boss-icon-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: 2px solid transparent; border-radius: 8px; padding: 4px 2px 5px;
    cursor: pointer; font-size: 10px; color: var(--muted); font-family: inherit; line-height: 1.2;
  }
  .boss-icon-btn img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; display: block; }
  .boss-icon-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .boss-icon-btn:hover { background: var(--accent-soft); }
  .boss-icon-btn.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 700; }
  .modal-boss-row-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .modal-boss-icon { width: 20px; height: 20px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .modal-hint { font-size: 11.5px; color: var(--muted); margin: 4px 0 12px; }
  .modal-boss-status { margin-bottom: 16px; padding-top: 10px; border-top: 1px solid var(--border); }
  .modal-boss-status-title { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .modal-boss-list { display: flex; flex-direction: column; gap: 4px; height: 140px; overflow-y: auto; }
  .char-view-boss-list { height: auto; max-height: none; overflow-y: visible; }
  .modal-boss-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12px; padding: 5px 8px; border-radius: 6px; background: var(--bg);
  }
  .modal-boss-row.editing { border: 1px solid var(--accent); background: var(--accent-soft); }
  .modal-boss-row .price { color: var(--money-grad-1); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .modal-boss-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .modal-boss-delete-btn {
    background: none; border: none; color: var(--danger); cursor: pointer; font-size: 15px;
    line-height: 1; padding: 0 2px; flex-shrink: 0; opacity: 0.75;
  }
  .modal-boss-delete-btn:hover { opacity: 1; }
  .modal-boss-empty { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .modal-cancel-btn {
    background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .modal-save-btn {
    background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-weight: 700; font-size: 13px;
  }
  [data-theme="dark"] .modal-save-btn { color: #201404; }
  .modal-add-btn {
    background: var(--success); color: #fff; border: none; padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-weight: 700; font-size: 13px;
  }
  [data-theme="dark"] .modal-add-btn { color: #0F2417; }
  .modal-delete-btn {
    background: none; border: 1px solid var(--danger); color: var(--danger); padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px; margin-right: auto;
  }
  .difficulty-badge {
    font-size: 10px; font-weight: 700; color: #fff; padding: 2px 6px; border-radius: 4px;
    flex-shrink: 0; white-space: nowrap;
  }
  .boss-price {
    font-size: 11px; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft);
    border: 1px solid var(--accent); padding: 2px 7px; border-radius: 20px; white-space: nowrap;
    flex-shrink: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatHM(mins) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h > 0) return m > 0 ? `${h}시간 ${m}분` : `${h}시간`;
    return `${m}분`;
  }

  function formatMesoCompact(amount) {
    if (!amount || amount <= 0) return '0억';
    let str = (amount / 100000000).toFixed(2);
    str = str.replace(/\.?0+$/, '');
    return `${str}억`;
  }

  function formatMeso(amount) {
    return formatMesoCompact(amount) + ' 메소';
  }

  const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
  function kstNow() { return new Date(Date.now() + KST_OFFSET_MS); }
  function kstWallToEpoch(y, mo, d, h = 0, mi = 0, s = 0) { return Date.UTC(y, mo, d, h, mi, s) - KST_OFFSET_MS; }
  function getResetBoundaries() {
    const kst = kstNow();
    const y = kst.getUTCFullYear();
    const mo = kst.getUTCMonth();
    const d = kst.getUTCDate();
    const dow = kst.getUTCDay();
    const daily = kstWallToEpoch(y, mo, d, 0, 0, 0);
    const diffToThu = (dow - 4 + 7) % 7;
    const weekly = kstWallToEpoch(y, mo, d - diffToThu, 0, 0, 0);
    const monthly = kstWallToEpoch(y, mo, 1, 0, 0, 0);
    return { daily, weekly, monthly };
  }

  function checkAndApplyResets() {
    if (!state.lastReset) state.lastReset = { daily: 0, weekly: 0, monthly: 0 };
    const boundaries = getResetBoundaries();
    let changed = false;

    ['daily', 'weekly', 'monthly'].forEach(themeKey => {
      if (!state.lastReset[themeKey]) {
        state.lastReset[themeKey] = boundaries[themeKey];
        changed = true;
        return;
      }
      if (boundaries[themeKey] > state.lastReset[themeKey]) {
        const boardIds = state.categories.filter(c => c.theme === themeKey).map(c => c.id);
        state.tasks = state.tasks.map(t => boardIds.includes(t.categoryId) ? { ...t, completed: false } : t);
        state.lastReset[themeKey] = boundaries[themeKey];
        changed = true;
      }
    });

    if (changed) { render(); saveState(); }
  }

  function waitForWindowStorage(timeoutMs) {
    return new Promise(resolve => {
      const start = Date.now();
      (function check() {
        if (window.storage || Date.now() - start >= timeoutMs) { resolve(); return; }
        setTimeout(check, 50);
      })();
    });
  }

  const persist = {
    async get(key) {
      if (window.storage) {
        try { return await window.storage.get(key, false); }
        catch (e) { /* window.storage 오류는 예상된 상황 — localStorage로 조용히 대체 */ }
      }
      try {
        const v = localStorage.getItem(key);
        return v !== null ? { value: v } : null;
      } catch (e) { console.error('localStorage 읽기 실패:', e); return null; }
    },
    async set(key, value) {
      if (window.storage) {
        try { return await window.storage.set(key, value, false); }
        catch (e) { /* window.storage 오류는 예상된 상황 — localStorage로 조용히 대체 */ }
      }
      try { localStorage.setItem(key, value); }
      catch (e) { console.error('localStorage 저장 실패:', e); }
    }
  };

  async function loadState() {
    let migratedFromLegacy = false;
    try {
      await waitForWindowStorage(1000);
      let result = await persist.get(STORAGE_KEY);
      if (!result || !result.value) {
        for (const legacyKey of LEGACY_STORAGE_KEYS) {
          const legacyResult = await persist.get(legacyKey);
          if (legacyResult && legacyResult.value) { result = legacyResult; migratedFromLegacy = true; break; }
        }
      }
      if (result && result.value) {
        const saved = JSON.parse(result.value);
        state = { ...state, ...saved };
        state.categories = (state.categories || []).map(c => ({ theme: 'weekly', ...c }));
        state.characters = state.characters || [];
        state.tasks = (state.tasks || []).map(t => ({ characterId: null, ...t }));
        state.lastReset = { daily: 0, weekly: 0, monthly: 0, ...(state.lastReset || {}) };
      }
    } catch (e) {
      console.error('저장된 데이터를 불러오지 못했습니다:', e);
    }
    applyTheme();
    render();
    if (migratedFromLegacy) saveState();
    checkAndApplyResets();
    setInterval(checkAndApplyResets, 60 * 1000);
  }

  async function saveState() {
    await persist.set(STORAGE_KEY, JSON.stringify(state));
  }

  function applyTheme() {
    document.body.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
    document.getElementById('themeKnob').textContent = state.darkMode ? '🌙' : '☀️';
  }
  function toggleTheme() { state.darkMode = !state.darkMode; applyTheme(); saveState(); }

  function addCharacter() {
    const input = document.getElementById('charNameInput');
    const name = input.value.trim();
    if (!name) return;
    if (state.characters.length >= MAX_CHARACTERS) {
      alert(`캐릭터는 최대 ${MAX_CHARACTERS}개까지 등록할 수 있어요!`);
      return;
    }
    state.characters.push({ id: 'char_' + Date.now(), name });
    input.value = '';
    render(); saveState();
  }
  function deleteCharacter(id) {
    state.characters = state.characters.filter(c => c.id !== id);
    state.tasks = state.tasks.map(t => t.characterId === id ? { ...t, characterId: null } : t);
    render(); saveState();
  }

  function addBoard(themeKey) {
    state.categories.push({ id: 'cat_' + Date.now(), name: '새 목록', theme: themeKey });
    render(); saveState();
  }
  function commitBoardName(catId, el) {
    const text = el.textContent.trim() || '이름 없는 목록';
    el.textContent = text;
    const cat = state.categories.find(c => c.id === catId);
    if (cat) cat.name = text;
    saveState();
  }
  function deleteBoard(catId) {
    const hasTasks = state.tasks.some(t => t.categoryId === catId);
    if (hasTasks && !confirm('이 목록의 할 일도 함께 삭제됩니다. 계속할까요?')) return;
    state.categories = state.categories.filter(c => c.id !== catId);
    state.tasks = state.tasks.filter(t => t.categoryId !== catId);
    render(); saveState();
  }
  function markAllComplete(catId) {
    state.tasks = state.tasks.map(t => t.categoryId === catId ? { ...t, completed: true } : t);
    render(); saveState();

  function bossIconGridHtml(selectedName) {
    return BOSS_NAMES.map(name => `
      <button type="button" class="boss-icon-btn ${name === selectedName ? 'selected' : ''}" title="${escapeHtml(name)}" onclick="selectModalBossName('${escapeHtml(name)}')">
        <img src="${BOSS_ICONS[name]}" alt="${escapeHtml(name)}">
        <span>${escapeHtml(name)}</span>
      </button>
    `).join('');
  }

  function selectModalBossName(name) {
    document.getElementById('modalBossName').value = name;

  function updateModalDifficultyOptions() {
    const nameVal = document.getElementById('modalBossName').value;
    const diffSel = document.getElementById('modalBossDifficulty');
    const options = BOSS_GROUPS[nameVal] || [];
    diffSel.innerHTML = options.map(o => `<option value="${o.difficulty}">${o.difficulty} · ${formatMeso(o.price)}</option>`).join('');
    diffSel.selectedIndex = 0; // 보스가 바뀌면 이전 난이도가 우연히 겹쳐 남지 않도록 항상 첫 옵션으로 초기화
  }

  function updateModalCountHint() {
    const charSel = document.getElementById('modalBossChar');
    const hint = document.getElementById('modalBossHint');
    const characterId = charSel.value;
    if (!characterId) { hint.textContent = ''; renderModalBossList(null); return; }
    let count = state.tasks.filter(t => t.isBoss && t.characterId === characterId && isWeeklyBoardId(t.categoryId)).length;
    if (bossModalState.taskId) {
      const editing = state.tasks.find(t => t.id === bossModalState.taskId);
      if (editing && editing.characterId === characterId) count -= 1; // 수정 중인 자기 자신은 중복 카운트하지 않음
    }
    hint.textContent = `${state.characters.find(c => c.id === characterId)?.name || ''} · 이번 주 ${count}/${WEEKLY_BOSS_LIMIT}마리 등록됨`;
    renderModalBossList(characterId);
  }

  function bossSortIndex(bossName, difficulty) {
    const nameIdx = BOSS_NAMES.indexOf(bossName);
    const diffOptions = BOSS_GROUPS[bossName] || [];
    const diffIdx = diffOptions.findIndex(o => o.difficulty === difficulty);
    return (nameIdx === -1 ? BOSS_NAMES.length : nameIdx) * 100 + (diffIdx === -1 ? 0 : diffIdx);
  }

  function renderModalBossList(characterId) {
    const listEl = document.getElementById('modalBossList');
    const titleEl = document.getElementById('modalBossStatusTitle');
    if (!characterId) { listEl.innerHTML = ''; return; }
    let bosses = state.tasks.filter(t => t.isBoss && t.characterId === characterId && isWeeklyBoardId(t.categoryId));
    if (titleEl) titleEl.textContent = '이 캐릭터의 보스 현황';
    bosses = bosses.slice().sort((a, b) => bossSortIndex(a.bossName, a.bossDifficulty) - bossSortIndex(b.bossName, b.bossDifficulty));
    if (bosses.length === 0) {
      listEl.innerHTML = '<div class="modal-boss-empty">등록된 보스가 없어요.</div>';
      return;
    }
    listEl.innerHTML = bosses.map(b => `
      <div class="modal-boss-row ${bossModalState.taskId === b.id ? 'editing' : ''}">
        <span class="modal-boss-row-left">
          ${BOSS_ICONS[b.bossName] ? `<img class="modal-boss-icon" src="${BOSS_ICONS[b.bossName]}" alt="">` : ''}
          <span>${b.bossDifficulty} ${escapeHtml(b.bossName)}${b.partySize > 1 ? ` (${b.partySize}인)` : ''}</span>
        </span>
        <span class="modal-boss-row-right">
          <span class="price">${formatMeso(b.price)}</span>
          <button class="modal-boss-delete-btn" title="삭제" onclick="deleteModalBossEntry(${b.id})">&times;</button>
        </span>
      </div>
    `).join('');
  }

  function deleteModalBossEntry(taskId) {
    if (bossModalState.taskId === taskId) bossModalState.taskId = null; // 수정 대상이 삭제되면 수정 상태 해제
    deleteTask(taskId); // 카드/합계 등은 여기서 이미 render()+saveState()됨
    updateModalCountHint(); // 팝업 안의 현황 목록·한도 힌트는 별도로 새로고침
  }

  function closeBossModal() {
    document.getElementById('bossModalOverlay').style.display = 'none';
    document.body.style.overflow = '';
    bossModalState = { catId: null, taskId: null, linkTaskId: null, addedIds: [] };
  }

  function cancelBossModal() {
    if (bossModalState.addedIds && bossModalState.addedIds.length > 0) {
      const ids = new Set(bossModalState.addedIds);
      state.tasks = state.tasks.filter(t => !ids.has(t.id)); // 이 팝업 세션에서 '추가'로 등록한 항목을 전부 되돌림
      saveState();
      render();
    }
    closeBossModal();
  }

  function showModalWarning(msg) {
    const el = document.getElementById('modalWarning');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideModalWarning() {
    document.getElementById('modalWarning').style.display = 'none';
  }

  function isDuplicateBossForCharacter(characterId, bossName, excludeTaskId) {
    return state.tasks.some(t =>
      t.isBoss && t.characterId === characterId && t.bossName === bossName &&
      isWeeklyBoardId(t.categoryId) && t.id !== excludeTaskId
    );
  }

  function readModalBossForm() {
    const nameSel = document.getElementById('modalBossName');
    const diffSel = document.getElementById('modalBossDifficulty');
    const partySel = document.getElementById('modalBossParty');
    const charSel = document.getElementById('modalBossChar');
    const bossName = nameSel.value;
    const difficulty = diffSel.value;
    const entry = (BOSS_GROUPS[bossName] || []).find(o => o.difficulty === difficulty);
    if (!entry) { showModalWarning('보스와 난이도를 선택해주세요!'); return null; }
    const characterId = charSel.value;
    if (!characterId) { showModalWarning('캐릭터를 선택해주세요! (보스는 캐릭터당 주 12마리 제한이 있어요)'); return null; }
    const partySize = parseInt(partySel.value) || 1;
    return { bossName, difficulty, entry, characterId, partySize };
  }

  function finishBossModal() {
    if (!bossModalState.taskId) {
      // 등록 모드: 이 버튼은 새로 만들지 않고, 그동안 '추가'로 등록해둔 것만 그대로 둔 채 닫습니다.
      closeBossModal();
      return;
    }
    // 수정 모드: 폼에 입력된 내용을 기존 보스에 반영합니다.
    const form = readModalBossForm();
    if (!form) return;
    const { bossName, difficulty, entry, characterId, partySize } = form;

    if (isDuplicateBossForCharacter(characterId, bossName, bossModalState.taskId)) {
      const charName = state.characters.find(c => c.id === characterId)?.name || '이 캐릭터';
      showModalWarning(`${charName}은(는) 이미 ${bossName}을(를) 등록했어요! 같은 보스는 난이도와 상관없이 두 번 등록할 수 없어요.`);
      return;
    }

    let count = state.tasks.filter(t => t.isBoss && t.characterId === characterId && isWeeklyBoardId(t.categoryId)).length;
    const editing = state.tasks.find(t => t.id === bossModalState.taskId);
    if (editing && editing.characterId === characterId) count -= 1;
    if (count >= WEEKLY_BOSS_LIMIT) {
      const charName = state.characters.find(c => c.id === characterId)?.name || '이 캐릭터';
      showModalWarning(`${charName}은(는) 이번 주 보스 ${WEEKLY_BOSS_LIMIT}마리를 이미 모두 등록했어요!`);
      return;
    }

    if (editing) {
      editing.bossName = bossName; editing.bossDifficulty = difficulty; editing.partySize = partySize;
      editing.characterId = characterId; editing.fullPrice = entry.price; editing.price = Math.floor(entry.price / partySize);
      editing.text = `${difficulty} ${bossName}`;
    }
    closeBossModal();
    render(); saveState();
  }

  function addAnotherModalBoss() {
    if (bossModalState.taskId) return; // 수정 모드에서는 사용하지 않음
    const form = readModalBossForm();
    if (!form) return;
    const { bossName, difficulty, entry, characterId, partySize } = form;

    if (isDuplicateBossForCharacter(characterId, bossName, null)) {
      const charName = state.characters.find(c => c.id === characterId)?.name || '이 캐릭터';
      showModalWarning(`${charName}은(는) 이미 ${bossName}을(를) 등록했어요! 같은 보스는 난이도와 상관없이 두 번 등록할 수 없어요.`);
      return;
    }

    const count = state.tasks.filter(t => t.isBoss && t.characterId === characterId && isWeeklyBoardId(t.categoryId)).length;
    if (count >= WEEKLY_BOSS_LIMIT) {
      const charName = state.characters.find(c => c.id === characterId)?.name || '이 캐릭터';
      showModalWarning(`${charName}은(는) 이번 주 보스 ${WEEKLY_BOSS_LIMIT}마리를 이미 모두 등록했어요!`);
      return;
    }

    const newId = Date.now();
    state.tasks.push({
      id: newId, text: `${difficulty} ${bossName}`, time: 0, completed: false,
      categoryId: bossModalState.catId, characterId, linkedTaskId: bossModalState.linkTaskId,
      isBoss: true, bossDifficulty: difficulty, bossName, partySize,
      fullPrice: entry.price, price: Math.floor(entry.price / partySize)
    });
    bossModalState.addedIds.push(newId);
    saveState();
    hideModalWarning();

    // 방금 추가한 내용을 폼에서 비워서, 이어서 '저장 후 닫기'를 눌러도 같은 보스가 중복 등록되지 않게 합니다.
    document.getElementById('modalBossName').value = '';
    document.getElementById('modalBossDifficulty').innerHTML = '';
    document.querySelectorAll('#modalBossIconGrid .boss-icon-btn').forEach(btn => btn.classList.remove('selected'));

    updateModalCountHint(); // 팝업은 닫지 않고, 현황/한도만 새로고침
    render();
  }

  function deleteModalBoss() {
    if (bossModalState.taskId) deleteTask(bossModalState.taskId);
    closeBossModal();
  }

  function addTask(catId) {
    const cat = state.categories.find(c => c.id === catId);
    const textInput = document.getElementById('taskInput_' + catId);
    const timeInput = document.getElementById('timeInput_' + catId);
    const charSelect = document.getElementById('charSelect_' + catId);
    const text = textInput.value.trim();
    if (!text) { alert(cat.theme === 'memo' ? '메모 내용을 입력해주세요!' : '할 일을 입력해주세요!'); return; }
    let time = 0;
    if (cat.theme !== 'memo') {
      const rawTime = timeInput.value;
      if (rawTime !== '' && rawTime !== null) {
        time = parseInt(rawTime);
        if (isNaN(time) || time < 0) { alert('올바른 시간을 입력해주세요! (0 이상의 숫자)'); return; }
      }
    }
    const characterId = charSelect.value || null;
    state.tasks.push({ id: Date.now(), text, time, completed: false, categoryId: catId, characterId });
    render(); saveState();
  }

  function toggleTask(id) {
    const target = state.tasks.find(t => t.id === id);
    if (!target) return;
    const newCompleted = !target.completed;
    state.tasks = state.tasks.map(t => t.id === id ? { ...t, completed: newCompleted } : t);
    if (!target.isBoss) {
      // 이 항목에 연결해서 등록해둔 보스들도 함께 체크/해제
      state.tasks = state.tasks.map(t => (t.isBoss && t.linkedTaskId === id) ? { ...t, completed: newCompleted } : t);
    }
    render(); saveState();
  }
  function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    render(); saveState();
  }

  function themeTotals(themeKey) {
    const boardIds = state.categories.filter(c => c.theme === themeKey).map(c => c.id);
    const themeTasks = state.tasks.filter(t => boardIds.includes(t.categoryId) && !t.isDivider);
    const total = themeTasks.reduce((s, t) => s + t.time, 0);
    const done = themeTasks.filter(t => t.completed).reduce((s, t) => s + t.time, 0);
    return { total, done };
  }
  function weeklyBossTotals() {
    const boardIds = state.categories.filter(c => c.theme === 'weekly').map(c => c.id);
    const bossTasks = state.tasks.filter(t => t.isBoss && boardIds.includes(t.categoryId));
    const earned = bossTasks.filter(t => t.completed).reduce((s, t) => s + t.price, 0);
    const potential = bossTasks.reduce((s, t) => s + t.price, 0);
    return { earned, potential };
  }

  function characterBossEarned(characterId) {
    const boardIds = state.categories.filter(c => c.theme === 'weekly').map(c => c.id);
    return state.tasks
      .filter(t => t.isBoss && t.completed && t.characterId === characterId && boardIds.includes(t.categoryId))
      .reduce((s, t) => s + t.price, 0);
  }

  function characterBossEarnedInCard(characterId, catId) {
    return state.tasks
      .filter(t => t.isBoss && t.completed && t.characterId === characterId && t.categoryId === catId)
      .reduce((s, t) => s + t.price, 0);
  }

  function taskLinkedBossEarned(taskId) {
    return state.tasks
      .filter(t => t.isBoss && t.completed && t.linkedTaskId === taskId)
      .reduce((s, t) => s + t.price, 0);
  }

  function characterBossPotential(characterId) {
    const boardIds = state.categories.filter(c => c.theme === 'weekly').map(c => c.id);
    return state.tasks
      .filter(t => t.isBoss && t.characterId === characterId && boardIds.includes(t.categoryId))
      .reduce((s, t) => s + t.price, 0);
  }

  function characterTimeTotal(characterId) {
    return state.tasks
      .filter(t => t.characterId === characterId && !t.isDivider)
      .reduce((s, t) => s + t.time, 0);
  }

  function charOptionsHtml() {
    let html = `<option value="">캐릭터 없음</option>`;
    state.characters.forEach(c => { html += `<option value="${c.id}">${escapeHtml(c.name)}</option>`; });
    return html;
  }
  function charOptionsHtmlRequired() {
    if (state.characters.length === 0) return `<option value="">등록된 캐릭터 없음</option>`;
    return state.characters.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  }

  function renderCharacters() {
    const row = document.getElementById('charChipRow');
    document.getElementById('charCount').textContent = `${state.characters.length}/${MAX_CHARACTERS}`;
    if (state.characters.length === 0) {
      row.innerHTML = '<span class="empty-state">등록된 캐릭터가 없어요. 아래에서 추가해보세요.</span>';
      return;
    }
    row.innerHTML = state.characters.map((c, idx) => {
      const earned = characterBossEarned(c.id);

      return `
      <div class="char-grid-item" data-id="${c.id}">
        <div class="char-grid-actions">
          <button class="char-icon-btn" title="열람" onclick="openCharacterViewModal('${c.id}')">👁</button>
          <button class="char-icon-btn" title="수정" onclick="openCharacterEditModal('${c.id}')">✎</button>
          <button class="char-icon-btn char-icon-danger" onclick="deleteCharacter('${c.id}')" title="삭제">×</button>
        </div>
        <div class="char-avatar-wrap">
          <div class="char-avatar">${c.image ? `<img src="${c.image}" alt="">` : '👤'}</div>
          <span class="char-number-badge">${idx + 1}</span>
        </div>
        <div class="char-grid-name">${escapeHtml(c.name)}</div>
        <div class="char-grid-bottom">
          <span class="char-time-chip">⏱ ${formatHM(timeTotal)}</span>
          ${potential > 0 ? `<span class="task-boss-total">${COIN_ICON} ${formatMesoCompact(earned)} / ${formatMesoCompact(potential)}</span>` : ''}
        </div>
      </div>
    `;
    }).join('');
  }

  // --- 캐릭터 열람(읽기 전용) 팝업 ---
  function openCharacterViewModal(charId) {
    const c = state.characters.find(x => x.id === charId);
    if (!c) return;
    document.getElementById('charViewTitle').textContent = `${c.name} 정보`;
    document.getElementById('charViewAvatar').innerHTML = c.image ? `<img src="${c.image}" alt="">` : '👤';
    document.getElementById('charViewTime').textContent = `⏱ ${formatHM(characterTimeTotal(c.id))}`;
    const earned = characterBossEarned(c.id);
    const potential = characterBossPotential(c.id);
    document.getElementById('charViewMoneyRow').innerHTML = potential > 0
      ? `${COIN_ICON} ${formatMeso(earned)} / ${formatMeso(potential)}`

    listEl.innerHTML = bosses.length === 0
      ? '<div class="modal-boss-empty">등록된 보스가 없어요.</div>'
      : bosses.map(b => `
          <div class="modal-boss-row">
            <span class="modal-boss-row-left">
              ${BOSS_ICONS[b.bossName] ? `<img class="modal-boss-icon" src="${BOSS_ICONS[b.bossName]}" alt="">` : ''}
              <span>${b.bossDifficulty} ${escapeHtml(b.bossName)}${b.partySize > 1 ? ` (${b.partySize}인)` : ''}</span>
            </span>
            <span class="price">${formatMeso(b.price)}</span>
          </div>
        `).join('');

    document.getElementById('charViewModalOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeCharViewModal() {
    document.getElementById('charViewModalOverlay').style.display = 'none';
    document.body.style.overflow = '';
  }

  // --- 캐릭터 수정(이름 · 이미지) 팝업 ---
  let charEditState = { id: null, pendingImage: undefined };

  function openCharacterEditModal(charId) {
    const c = state.characters.find(x => x.id === charId);
    if (!c) return;
    charEditState = { id: charId, pendingImage: undefined };
    document.getElementById('charEditNameInput').value = c.name;
    renderCharEditAvatarPreview(c.image || null);
    document.getElementById('charEditModalOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function renderCharEditAvatarPreview(image) {
    document.getElementById('charEditAvatarPreview').innerHTML = image ? `<img src="${image}" alt="">` : '👤';
  }
  function handleCharEditImageChange(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 96;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        charEditState.pendingImage = dataUrl;
        renderCharEditAvatarPreview(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function clearCharEditImage() {
    charEditState.pendingImage = null;
    renderCharEditAvatarPreview(null);
  }
  function closeCharEditModal() {
    document.getElementById('charEditModalOverlay').style.display = 'none';
    document.body.style.overflow = '';
    charEditState = { id: null, pendingImage: undefined };
  }
  function saveCharEdit() {
    const c = state.characters.find(x => x.id === charEditState.id);
    if (!c) { closeCharEditModal(); return; }
    const name = document.getElementById('charEditNameInput').value.trim();
    if (name) c.name = name;
    if (charEditState.pendingImage !== undefined) c.image = charEditState.pendingImage; // null이면 이미지 제거
    closeCharEditModal();
    render(); saveState();
  }

  function startEditTask(ev, taskId) {
    ev.stopPropagation();
    const el = document.getElementById('taskText_' + taskId);
    if (!el) return;
    el.contentEditable = 'true';
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let finished = false;
    function finish(save) {
      if (finished) return;
      finished = true;
      el.removeEventListener('blur', onBlur);
      el.removeEventListener('keydown', onKeydown);
      el.contentEditable = 'false';
      if (save) {
        const text = el.textContent.trim();
        if (text) {
          const task = state.tasks.find(t => t.id === taskId);
          if (task) { task.text = text; saveState(); }
        }
      }
      render();
    }
    function onBlur() { finish(true); }
    function onKeydown(e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    }
    el.addEventListener('blur', onBlur);
    el.addEventListener('keydown', onKeydown);
  }

  function startEditTaskTime(ev, taskId) {
    ev.stopPropagation();
    const el = document.getElementById('taskTime_' + taskId);
    if (!el) return;
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) return;
    el.contentEditable = 'true';
    el.textContent = String(task.time);
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let finished = false;
    function finish(save) {
      if (finished) return;
      finished = true;
      el.removeEventListener('blur', onBlur);
      el.removeEventListener('keydown', onKeydown);
      el.contentEditable = 'false';
      if (save) {
        const raw = el.textContent.trim();
        const time = parseInt(raw);
        if (!isNaN(time) && time >= 0) { task.time = time; saveState(); }
      }
      render();
    }
    function onBlur() { finish(true); }
    function onKeydown(e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      else if (!/[0-9]/.test(e.key) && !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) {
        e.preventDefault();
      }
    }
    el.addEventListener('blur', onBlur);
    el.addEventListener('keydown', onKeydown);
  }

  function renderExp() {
    const { total, done } = themeTotals('weekly');
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('totalFigure').textContent = formatHM(done);
    document.getElementById('totalSub').textContent = `완료 ${formatHM(done)} / 전체 ${formatHM(total)}`;
    document.getElementById('totalFill').style.width = pct + '%';
    document.getElementById('totalPct').textContent = pct + '%';

    const { earned, potential } = weeklyBossTotals();
    const moneyBlock = document.getElementById('moneyBlock');
    if (potential > 0) {
      moneyBlock.style.display = 'block';
      const moneyPct = Math.round((earned / potential) * 100);
      document.getElementById('moneyFigure').textContent = formatMeso(earned);
      document.getElementById('moneySub').textContent = `완료 ${formatMeso(earned)} / 전체 ${formatMeso(potential)}`;
      document.getElementById('moneyFill').style.width = moneyPct + '%';
      document.getElementById('moneyPct').textContent = moneyPct + '%';
    } else {
      moneyBlock.style.display = 'none';
    }
  }

  function boardCardHtml(cat) {
    const catTasks = state.tasks.filter(t => t.categoryId === cat.id);
    const isMemo = cat.theme === 'memo';
    const realTasks = catTasks.filter(t => !t.isDivider);
    const catTotal = realTasks.reduce((s, t) => s + t.time, 0);
    const catDone = realTasks.filter(t => t.completed).reduce((s, t) => s + t.time, 0);
    const catPct = catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0;
    const color = THEME_META[cat.theme].color;
    const isWeekly = cat.theme === 'weekly';
    const isMonthly = cat.theme === 'monthly';
    const panelOpen = openBossPanels.has(cat.id);
    const bossTasks = realTasks.filter(t => t.isBoss);
    const bossEarned = bossTasks.filter(t => t.completed).reduce((s, t) => s + t.price, 0);
    const bossPotential = bossTasks.reduce((s, t) => s + t.price, 0);
    const bossPct = bossPotential > 0 ? Math.round((bossEarned / bossPotential) * 100) : 0;

    let tasksHtml = '';
    const visibleTasks = catTasks.filter(t => !t.isBoss);
    if (visibleTasks.length === 0) {
      tasksHtml = `<div class="empty-state">${isMemo ? '아직 메모가 없어요.' : '아직 등록된 할 일이 없어요.'}</div>`;
    } else {
      tasksHtml = visibleTasks.map(task => {
        if (task.isDivider) {
          return `
        <li class="task-divider ${panelOpen ? 'editable' : ''}" data-id="${task.id}">
          <span class="divider-line"></span>
          ${panelOpen ? `
          <div class="row-hover-actions">
            <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})" title="구분선 삭제">&times;</button>
          </div>
          ` : ''}
        </li>`;
        }
        const character = task.characterId ? state.characters.find(c => c.id === task.characterId) : null;

        const charChipHtml = character
          ? `<span class="task-char">${escapeHtml(character.name)}</span>`
          : `<span class="task-char chip-placeholder">-</span>`;
        const timeChipHtml = !isMemo
          ? (task.time > 0
              ? `<span class="task-time" id="taskTime_${task.id}" onclick="if(this.isContentEditable){event.stopPropagation();}else if(${panelOpen}){startEditTaskTime(event, ${task.id});}">${formatHM(task.time)}</span>`
              : `<span class="task-time chip-placeholder">0분</span>`)
          : '';
        const bossEarnedForChar = taskLinkedBossEarned(task.id);
        const bossChipHtml = (isWeekly || isMonthly)
          ? (character && bossEarnedForChar > 0
              ? `<span class="task-boss-total">${COIN_ICON} ${formatMesoCompact(bossEarnedForChar)}</span>`
              : `<span class="task-boss-total chip-placeholder">${COIN_ICON} 0억</span>`)
          : '';
        const metaHtml = (!character && !isMemo && task.time > 0)
          ? timeChipHtml + charChipHtml + bossChipHtml
          : charChipHtml + timeChipHtml + bossChipHtml;
        return `
        <li class="task-item ${task.completed ? 'completed' : ''} ${panelOpen ? 'editable' : ''}"
            style="--chip-accent: ${color};"
            onclick="toggleTask(${task.id})"
            data-id="${task.id}">
          <div class="task-left">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${task.id})">
            <span class="task-text" id="taskText_${task.id}" onclick="if(this.isContentEditable){event.stopPropagation();}else if(${panelOpen}){startEditTask(event, ${task.id});}">${escapeHtml(task.text)}</span>
          </div>
          <div class="task-meta">
            ${metaHtml}
          </div>
          ${panelOpen ? `
          <div class="row-hover-actions">
            ${(isWeekly && character) ? `<button class="row-add-btn" title="${escapeHtml(character.name)} 보스 추가" onclick="event.stopPropagation(); openBossModal('${cat.id}', null, '${character.id}', ${task.id})">✎</button>` : ''}
            <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})">&times;</button>
          </div>
          ` : ''}
        </li>`;
      }).join('');
    }

    return `
      <div class="card board" data-id="${cat.id}">
        <div class="board-header">
          <div class="board-name-wrap">
            <span class="board-dot" style="background:${color}"></span>
            <span class="board-name" contenteditable="true" spellcheck="false" id="boardName_${cat.id}">${escapeHtml(cat.name)}</span>
          </div>
          <div class="board-header-actions">
            <button class="mark-all-btn" onclick="markAllComplete('${cat.id}')">모두 완료</button>
            <button class="boss-settings-btn" title="편집" onclick="toggleBossPanel('${cat.id}')">🛠️</button>
            <button class="board-delete" title="목록 삭제" onclick="deleteBoard('${cat.id}')">🗑</button>
          </div>
        </div>
        ${!isMemo ? `
          <div class="board-progress-track"><div class="board-progress-fill" style="width:${catPct}%"></div></div>
          <div class="board-progress-label">완료 ${formatHM(catDone)} / ${formatHM(catTotal)} (${catPct}%)</div>
        ` : ''}
        ${(isWeekly && bossTasks.length > 0) ? `
          <div class="board-money-track"><div class="board-money-fill" style="width:${bossPct}%"></div></div>
          <div class="board-money-label">${COIN_ICON} 결정석 수익 ${formatMeso(bossEarned)} / ${formatMeso(bossPotential)} (${bossPct}%)</div>
        ` : ''}
        <ul class="board-tasks">${tasksHtml}</ul>
        <button class="add-divider-btn" onclick="addDivider('${cat.id}')" title="구분선 추가">— 구분선 추가 —</button>
        <div class="boss-panel" id="bossPanel_${cat.id}" style="display:${openBossPanels.has(cat.id) ? 'block' : 'none'};">
          ${isWeekly ? `
          <button class="boss-form-toggle" onclick="openBossModal('${cat.id}', null)">+ 보스 등록</button>
          ` : `
          <div class="edit-hint">✏️ 편집 모드예요. 이름이나 시간을 클릭하면 바로 수정할 수 있어요.</div>
          `}
        </div>
        <div class="board-add-row">
          <input type="text" id="taskInput_${cat.id}" placeholder="${isMemo ? '메모 입력' : '할 일 입력'}">
          ${!isMemo ? `<input type="number" id="timeInput_${cat.id}" placeholder="분(0 가능)" min="0">` : ''}
          <select id="charSelect_${cat.id}">${charOptionsHtml()}</select>
          <button onclick="addTask('${cat.id}')">추가</button>
        </div>
      </div>
    `;
  }

  function attachBoardListeners(cat) {
    const nameEl = document.getElementById('boardName_' + cat.id);
    if (nameEl) {
      nameEl.addEventListener('blur', () => commitBoardName(cat.id, nameEl));
      nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); } });
    }
    const taskInputEl = document.getElementById('taskInput_' + cat.id);
    if (taskInputEl) taskInputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(cat.id); });
    const timeInputEl = document.getElementById('timeInput_' + cat.id);
    if (timeInputEl) timeInputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(cat.id); });
  }

  function renderThemeSections() {
    const container = document.getElementById('themeSections');
    container.innerHTML = '';

    THEME_ORDER.forEach(themeKey => {
      const meta = THEME_META[themeKey];
      const boards = state.categories.filter(c => c.theme === themeKey);
      let badgeHtml = '';
      if (themeKey === 'daily' || themeKey === 'monthly') {
        const { total, done } = themeTotals(themeKey);
        badgeHtml = `<span class="theme-badge">완료 ${formatHM(done)} / ${formatHM(total)}</span>`;
      }

      const section = document.createElement('div');
      section.className = 'theme-section';
      section.innerHTML = `
        <div class="theme-section-header">
          <span class="theme-dot" style="background:${meta.color}"></span>
          <h3>${meta.label}</h3>
          ${badgeHtml}
        </div>
        <div class="board-grid" id="grid_${themeKey}"></div>
      `;
      container.appendChild(section);

      const grid = section.querySelector('#grid_' + themeKey);
      boards.forEach(cat => {
        grid.insertAdjacentHTML('beforeend', boardCardHtml(cat));
        attachBoardListeners(cat);
      });

      const addCard = document.createElement('div');
      addCard.className = 'add-board';
      addCard.textContent = '+ 새 목록 추가';
      addCard.onclick = () => addBoard(themeKey);
      grid.appendChild(addCard);
    });
  }

  function render() {
    renderCharacters();
    renderExp();
    renderThemeSections();
  }

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  loadState();
</script>

</body>
</html>
