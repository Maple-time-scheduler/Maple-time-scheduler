<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메이플 타임 스케줄러</title>
<style>
  :root {
    --bg: #FBEFD9;
    --surface: #FFF8EA;
    --ink: #4A3520;
    --muted: #8B6F4E;
    --border: #E3C68B;
    --accent: #FF9F1C;
    --accent-strong: #E67E00;
    --accent-soft: rgba(255,159,28,0.16);
    --success: #4C9F70;
    --success-soft: rgba(76,159,112,0.16);
    --danger: #D64545;
    --track: #F0DFB8;
    --shadow: 0 2px 0 var(--border), 0 10px 24px rgba(74,53,32,0.10);
    --theme-daily: #FF9F1C;
    --theme-weekly: #4C9F70;
    --theme-monthly: #4C7FD6;
    --theme-memo: #C99A2E;
  }
  [data-theme="dark"] {
    --bg: #18171C;
    --surface: #211F26;
    --ink: #F0EAE0;
    --muted: #9C9894;
    --border: #35333A;
    --accent: #FFB443;
    --accent-strong: #FFC968;
    --accent-soft: rgba(255,180,67,0.16);
    --success: #6FCB9F;
    --success-soft: rgba(111,203,159,0.16);
    --danger: #E8807A;
    --track: #2A282E;
    --shadow: 0 2px 0 var(--border), 0 10px 26px rgba(0,0,0,0.5);
    --theme-daily: #FFB25C;
    --theme-weekly: #7FD9A8;
    --theme-monthly: #8FAEFF;
    --theme-memo: #E8D07A;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--bg);
    color: var(--ink);
    font-family: '맑은 고딕', 'Malgun Gothic', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease;
    min-height: 100vh;
  }
  .app { width: 100%; max-width: 1080px; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; padding: 14px 4px 22px; gap: 16px; border-bottom: 1px solid var(--border); }
  .header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-title .icon { flex-shrink: 0; }
  .header-title h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; min-width: 60px; }

  .theme-toggle {
    position: relative; width: 56px; height: 30px; border-radius: 999px;
    background: var(--track); border: 2px solid var(--border); cursor: pointer; flex-shrink: 0;
  }
  .theme-toggle .knob {
    position: absolute; top: 1px; left: 1px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: transform 0.25s ease, background 0.25s ease;
  }
  [data-theme="dark"] .theme-toggle .knob { transform: translateX(26px); }

  .card { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }

  /* Character panel */
  .char-card { padding: 14px 16px; margin-bottom: 16px; }
  .char-card-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: baseline; gap: 6px; }
  .char-card-count { font-size: 11.5px; font-weight: 400; color: var(--muted); }
  .char-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .char-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
  }
  .char-number {
    font-size: 11px; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft);
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .char-chip-name { cursor: text; flex: 1; }
  .char-chip-name[contenteditable="true"] {
    outline: none; background: var(--surface);
    border: 1.5px solid var(--accent); border-radius: 6px; padding: 0 5px;
    box-shadow: 0 0 0 3px var(--accent-soft);
    display: inline-block; width: 110px; box-sizing: border-box;
  }
  .char-delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; flex-shrink: 0; }
  .char-delete-btn:hover { color: var(--danger); }
  .char-add-row { display: flex; gap: 6px; }
  .char-add-row input {
    flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--ink); font-size: 13px; font-family: inherit;
  }
  .char-add-row button {
    padding: 8px 14px; background: var(--accent); color: #fff; border: none; border-radius: 7px;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  [data-theme="dark"] .char-add-row button { color: #201404; }

  .exp-card { padding: 18px 20px; margin-bottom: 22px; }
  .exp-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .exp-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .exp-figure { font-size: 20px; font-weight: 700; color: var(--accent-strong); }
  .exp-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .exp-boss-sub { font-size: 12.5px; color: var(--accent-strong); font-weight: 700; margin-top: 8px; }
  .exp-track {
    width: 100%; height: 24px; border-radius: 999px; background: var(--track); border: 1px solid var(--border);
    overflow: hidden; position: relative;
    background-image: repeating-linear-gradient(90deg, transparent, transparent calc(10% - 1px), rgba(0,0,0,0.05) 10%);
  }
  [data-theme="dark"] .exp-track { background-image: repeating-linear-gradient(90deg, transparent, transparent calc(10% - 1px), rgba(255,255,255,0.06) 10%); }
  .exp-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, var(--success) 0%, var(--accent) 100%);
    box-shadow: 0 0 10px var(--accent-soft) inset; transition: width 0.4s ease;
  }
  .exp-pct {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 12px; font-weight: 700; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  .theme-section { margin-bottom: 24px; }
  .theme-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .theme-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .theme-section-header h3 { font-size: 15px; font-weight: 700; margin: 0; }
  .theme-badge { font-size: 12px; color: var(--muted); margin-left: 2px; }

  .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .board-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .board-grid { grid-template-columns: 1fr; } }

  .board { display: flex; flex-direction: column; padding: 14px 14px 16px; }
  .board-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .board-name-wrap { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
  .board-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .board-name {
    font-size: 15px; font-weight: 700; outline: none; min-width: 20px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .board-name[contenteditable="true"]:focus { outline: none; white-space: normal; }
  .board-header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .mark-all-btn {
    font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--success-soft); color: var(--success); cursor: pointer; font-weight: 700; white-space: nowrap;
  }
  .mark-all-btn:hover { background: var(--success); color: #fff; }
  .boss-settings-btn {
    font-size: 12px; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; cursor: pointer; line-height: 1;
  }
  .boss-settings-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .board-delete { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; flex-shrink: 0; opacity: 0.7; }
  .board-delete:hover { color: var(--danger); opacity: 1; }

  .board-progress-track { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; margin-bottom: 4px; }
  .board-progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s ease; }
  .board-progress-label { font-size: 11px; color: var(--muted); margin-bottom: 10px; text-align: right; }
  .board-boss-summary { font-size: 11.5px; color: var(--accent-strong); font-weight: 700; margin-bottom: 10px; text-align: right; }

  .board-tasks { list-style: none; padding: 0; margin: 0 0 6px; flex: 1; }
  .task-item {
    display: flex; align-items: flex-start; justify-content: space-between; padding: 7px 4px;
    gap: 6px; cursor: pointer; border-radius: 6px; transition: opacity 0.12s ease;
  }
  .task-item:hover { background: var(--accent-soft); }
  .task-item.completed .task-text { text-decoration: line-through; color: var(--muted); opacity: 0.45; }
  .task-item.completed .task-text[contenteditable="true"] { text-decoration: none; color: var(--ink); opacity: 1; }
  .task-left { display: flex; align-items: flex-start; gap: 8px; flex: 1 1 auto; min-width: 110px; padding-top: 2px; }
  .task-left input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--success); flex-shrink: 0; cursor: pointer; margin-top: 2px; }
  .task-text { font-size: 13.5px; word-break: break-word; }
  .task-text[contenteditable="true"] {
    outline: none; cursor: text; background: var(--surface);
    border: 1.5px solid var(--accent); border-radius: 6px; padding: 1px 6px;
    box-shadow: 0 0 0 3px var(--accent-soft);
    display: block; width: 100%; box-sizing: border-box;
  }
  .task-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; flex-shrink: 0; width: 112px; }
  .task-char, .task-time {
    font-size: 11px; color: var(--muted); padding: 2px 7px 2px 8px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .task-char {
    background: var(--track);
    border-left: 3px solid var(--chip-accent, var(--accent));
    border-radius: 4px 12px 12px 4px;
  }
  .task-time {
    cursor: text; background: transparent; border: 1px dashed var(--border);
    font-variant-numeric: tabular-nums; letter-spacing: 0.2px; padding: 1px 8px;
  }
  .task-time[contenteditable="true"] {
    outline: none; background: var(--surface);
    border: 1.5px solid var(--accent); border-radius: 20px;
    box-shadow: 0 0 0 3px var(--accent-soft);
    display: block; width: 100%; box-sizing: border-box; text-align: center;
  }
  .task-char.chip-placeholder, .task-time.chip-placeholder { visibility: hidden; pointer-events: none; cursor: default; }
  .delete-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 0 2px; flex-shrink: 0; line-height: 1; opacity: 0.7; }
  .row-hover-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .task-item.editable .row-hover-actions,
  .task-divider.editable .row-hover-actions { opacity: 0; transition: opacity 0.15s ease; }
  .task-item.editable:hover .row-hover-actions,
  .task-divider.editable:hover .row-hover-actions { opacity: 1; }
  .row-add-btn {
    background: none; border: none; color: var(--accent-strong); cursor: pointer; font-size: 17px;
    font-weight: 700; padding: 0 4px; flex-shrink: 0; line-height: 1;
  }
  .row-add-btn:hover { color: var(--accent); }
  .empty-state { color: var(--muted); font-size: 12.5px; padding: 6px 0 10px; }

  .board-add-row { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
  .board-add-row input[type="text"] { flex: 1; min-width: 70px; }
  .board-add-row input[type="number"] { width: 52px; }
  .board-add-row select { max-width: 90px; }
  .board-add-row input, .board-add-row select {
    padding: 7px 6px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--ink); font-size: 12px; font-family: inherit;
  }
  .board-add-row button {
    padding: 7px 11px; background: var(--accent); color: #fff; border: none; border-radius: 7px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }
  [data-theme="dark"] .board-add-row button { color: #201404; }
  .board-add-row button:hover { background: var(--accent-strong); }

  .boss-form-toggle {
    background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-strong); font-size: 11.5px; font-weight: 700;
    cursor: pointer; padding: 5px 10px; border-radius: 999px;
  }
  .boss-form-toggle:hover { background: var(--accent); color: #fff; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-card {
    background: var(--surface); border: 2px solid var(--border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 360px; box-shadow: var(--shadow);
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--ink); }
  .modal-field { margin-bottom: 10px; }
  .modal-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .modal-field select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--ink); font-size: 13px; font-family: inherit;
  }
  .modal-hint { font-size: 11.5px; color: var(--muted); margin: 4px 0 16px; }
  .modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .modal-cancel-btn {
    background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .modal-save-btn {
    background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-weight: 700; font-size: 13px;
  }
  [data-theme="dark"] .modal-save-btn { color: #201404; }
  .modal-delete-btn {
    background: none; border: 1px solid var(--danger); color: var(--danger); padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px; margin-right: auto;
  }
  .difficulty-badge {
    font-size: 10px; font-weight: 700; color: #fff; padding: 2px 6px; border-radius: 4px;
    flex-shrink: 0; white-space: nowrap;
  }
  .boss-price {
    font-size: 11px; font-weight: 700; color: var(--accent-strong); background: var(--accent-soft);
    border: 1px solid var(--accent); padding: 2px 7px; border-radius: 20px; white-space: nowrap;
    flex-shrink: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .boss-panel { margin-bottom: 10px; padding: 10px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--border); }
  .edit-hint { font-size: 11.5px; color: var(--muted); }

  .task-divider { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 6px; }
  .task-divider:hover { background: var(--accent-soft); }
  .divider-line { flex: 1; height: 0; border-top: 2px dashed var(--border); }
  .add-divider-btn {
    background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer;
    padding: 2px 0 10px; text-align: left; width: 100%;
  }
  .add-divider-btn:hover { color: var(--accent-strong); }

  .add-board {
    border: 2px dashed var(--border); border-radius: 14px; background: transparent; box-shadow: none;
    display: flex; align-items: center; justify-content: center; min-height: 100px; height: 100px; cursor: pointer;
    color: var(--muted); font-size: 13.5px; font-weight: 700; transition: border-color 0.2s ease, color 0.2s ease;
    align-self: start;
  }
  .add-board:hover { border-color: var(--accent); color: var(--accent-strong); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-title">
      <span class="icon">
        <svg width="30" height="30" viewBox="0 0 48 48">
          <ellipse cx="24" cy="34" rx="8" ry="10" fill="#F4D9A5"/>
          <path d="M6 22 C6 10 42 10 42 22 C42 26 38 28 24 28 C10 28 6 26 6 22 Z" fill="#FF7A1C"/>
          <ellipse cx="16" cy="18" rx="3" ry="2.4" fill="#FFD9A0"/>
          <ellipse cx="30" cy="16" rx="2.4" ry="2" fill="#FFD9A0"/>
          <ellipse cx="24" cy="22" rx="2" ry="1.6" fill="#FFD9A0"/>
        </svg>
      </span>
      <div>
        <h1 id="listTitleEl">메이플 타임 스케줄러</h1>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="다크모드 전환">
      <span class="knob" id="themeKnob">☀️</span>
    </button>
  </div>

  <div class="card char-card">
    <div class="char-card-title">🎮 내 캐릭터 <span class="char-card-count" id="charCount"></span></div>
    <div class="char-list" id="charChipRow"></div>
    <div class="char-add-row">
      <input type="text" id="charNameInput" placeholder="캐릭터 이름" onkeypress="if(event.key==='Enter')addCharacter()">
      <button onclick="addCharacter()">추가</button>
    </div>
  </div>

  <div class="card exp-card">
    <div class="exp-top">
      <div class="exp-title" id="expTitleEl">⭐ 주간 진행도</div>
      <div class="exp-figure" id="totalFigure">0분</div>
    </div>
    <div class="exp-sub" id="totalSub">완료 0분 / 전체 0분 (주간 컨텐츠 기준)</div>
    <div class="exp-track">
      <div class="exp-fill" id="totalFill"></div>
      <span class="exp-pct" id="totalPct">0%</span>
    </div>
    <div class="exp-boss-sub" id="bossSub"></div>
  </div>

  <div id="themeSections"></div>
</div>

<div class="modal-overlay" id="bossModalOverlay" style="display:none;" onclick="if(event.target===this) closeBossModal()">
  <div class="modal-card">
    <div class="modal-title" id="bossModalTitle">보스 등록</div>
    <div class="modal-field">
      <label>보스</label>
      <select id="modalBossName" onchange="updateModalDifficultyOptions()"></select>
    </div>
    <div class="modal-field">
      <label>난이도</label>
      <select id="modalBossDifficulty"></select>
    </div>
    <div class="modal-field">
      <label>인원</label>
      <select id="modalBossParty"></select>
    </div>
    <div class="modal-field">
      <label>캐릭터</label>
      <select id="modalBossChar" onchange="updateModalCountHint()"></select>
    </div>
    <div class="modal-hint" id="modalBossHint"></div>
    <div class="modal-actions">
      <button class="modal-delete-btn" id="modalDeleteBtn" onclick="deleteModalBoss()" style="display:none;">삭제</button>
      <button class="modal-cancel-btn" onclick="closeBossModal()">취소</button>
      <button class="modal-save-btn" onclick="saveModalBoss()">저장</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'scheduler-state-v2';
  const LEGACY_STORAGE_KEYS = ['scheduler-state'];

  const THEME_META = {
    daily:   { label: '일간', color: 'var(--theme-daily)' },
    weekly:  { label: '주간', color: 'var(--theme-weekly)' },
    monthly: { label: '월간', color: 'var(--theme-monthly)' },
    memo:    { label: '메모', color: 'var(--theme-memo)' }
  };
  const THEME_ORDER = ['daily', 'weekly', 'monthly', 'memo'];

  const DIFFICULTY_COLORS = {
    '이지': '#868E96',
    '노멀': '#339AF0',
    '하드': '#F06595',
    '카오스': '#343A40',
    '익스트림': '#862E9C'
  };

  const BOSS_DATA = [
    { difficulty: '카오스', boss: '자쿰', price: 4040000 },
    { difficulty: '카오스', boss: '블러디퀸', price: 4070000 },
    { difficulty: '카오스', boss: '반반', price: 4070000 },
    { difficulty: '카오스', boss: '피에르', price: 4080000 },
    { difficulty: '하드', boss: '매그너스', price: 4280000 },
    { difficulty: '카오스', boss: '벨룸', price: 4640000 },
    { difficulty: '카오스', boss: '파풀라투스', price: 6550000 },
    { difficulty: '노멀', boss: '스우', price: 8350000 },
    { difficulty: '노멀', boss: '데미안', price: 8750000 },
    { difficulty: '노멀', boss: '가디언 엔젤 슬라임', price: 12700000 },
    { difficulty: '이지', boss: '루시드', price: 14900000 },
    { difficulty: '이지', boss: '윌', price: 16100000 },
    { difficulty: '노멀', boss: '루시드', price: 17800000 },
    { difficulty: '노멀', boss: '윌', price: 20500000 },
    { difficulty: '노멀', boss: '더스크', price: 22000000 },
    { difficulty: '노멀', boss: '듄켈', price: 23700000 },
    { difficulty: '하드', boss: '데미안', price: 46400000 },

  function formatHM(mins) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h > 0) return m > 0 ? `${h}시간 ${m}분` : `${h}시간`;
    return `${m}분`;
  }

  function formatMeso(amount) {
    if (!amount || amount <= 0) return '0메소';
    const eok = Math.floor(amount / 100000000);
    const man = Math.floor((amount % 100000000) / 10000);
    const rest = amount % 10000;
    const parts = [];
    if (eok > 0) parts.push(`${eok}억`);
    if (man > 0) parts.push(`${man}만`);
    if (eok === 0 && man === 0) parts.push(`${rest}`);
    return parts.join(' ') + '메소';
  }

  const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
  function kstNow() { return new Date(Date.now() + KST_OFFSET_MS); }
  function kstWallToEpoch(y, mo, d, h = 0, mi = 0, s = 0) { return Date.UTC(y, mo, d, h, mi, s) - KST_OFFSET_MS; }
  function getResetBoundaries() {
    const kst = kstNow();
    const y = kst.getUTCFullYear();
    const mo = kst.getUTCMonth();
    const d = kst.getUTCDate();
    const dow = kst.getUTCDay();
    const daily = kstWallToEpoch(y, mo, d, 0, 0, 0);
    const diffToThu = (dow - 4 + 7) % 7;
    const weekly = kstWallToEpoch(y, mo, d - diffToThu, 0, 0, 0);
    const monthly = kstWallToEpoch(y, mo, 1, 0, 0, 0);
    return { daily, weekly, monthly };
  }

  function checkAndApplyResets() {
    if (!state.lastReset) state.lastReset = { daily: 0, weekly: 0, monthly: 0 };
    const boundaries = getResetBoundaries();
    let changed = false;

    ['daily', 'weekly', 'monthly'].forEach(themeKey => {
      if (!state.lastReset[themeKey]) {
        state.lastReset[themeKey] = boundaries[themeKey];
        changed = true;
        return;
      }
      if (boundaries[themeKey] > state.lastReset[themeKey]) {
        const boardIds = state.categories.filter(c => c.theme === themeKey).map(c => c.id);
        if (themeKey === 'weekly') {
          state.tasks = state.tasks
            .filter(t => !(boardIds.includes(t.categoryId) && t.isBoss))
            .map(t => boardIds.includes(t.categoryId) ? { ...t, completed: false } : t);
        } else {
          state.tasks = state.tasks.map(t => boardIds.includes(t.categoryId) ? { ...t, completed: false } : t);
        }
        state.lastReset[themeKey] = boundaries[themeKey];
        changed = true;
      }
    });

    if (changed) { render(); saveState(); }
  }

  function waitForWindowStorage(timeoutMs) {
    return new Promise(resolve => {
      const start = Date.now();
      (function check() {
        if (window.storage || Date.now() - start >= timeoutMs) { resolve(); return; }
        setTimeout(check, 50);
      })();
    });
  }

  const persist = {
    async get(key) {
      if (window.storage) {
        try { return await window.storage.get(key, false); }
        catch (e) { console.error('window.storage.get 실패, localStorage로 대체:', e); }
      }
      try {
        const v = localStorage.getItem(key);
        return v !== null ? { value: v } : null;
      } catch (e) { console.error('localStorage 읽기 실패:', e); return null; }
    },
    async set(key, value) {
      if (window.storage) {
        try { return await window.storage.set(key, value, false); }
        catch (e) { console.error('window.storage.set 실패, localStorage로 대체:', e); }
      }
      try { localStorage.setItem(key, value); }
      catch (e) { console.error('localStorage 저장 실패:', e); }
    }
  };

  async function loadState() {
    let migratedFromLegacy = false;
    try {
      await waitForWindowStorage(1000);
      let result = await persist.get(STORAGE_KEY);
      if (!result || !result.value) {
        for (const legacyKey of LEGACY_STORAGE_KEYS) {
          const legacyResult = await persist.get(legacyKey);
          if (legacyResult && legacyResult.value) { result = legacyResult; migratedFromLegacy = true; break; }
        }
      }
      if (result && result.value) {
        const saved = JSON.parse(result.value);
        state = { ...state, ...saved };
        state.categories = (state.categories || []).map(c => ({ theme: 'weekly', ...c }));
        state.characters = state.characters || [];
        state.tasks = (state.tasks || []).map(t => ({ characterId: null, ...t }));
        state.lastReset = { daily: 0, weekly: 0, monthly: 0, ...(state.lastReset || {}) };
      }
    } catch (e) {
      console.error('저장된 데이터를 불러오지 못했습니다:', e);
    }
    applyTheme();
    render();
    if (migratedFromLegacy) saveState();
    checkAndApplyResets();
    setInterval(checkAndApplyResets, 60 * 1000);
  }

    if (!entry) { alert('보스와 난이도를 선택해주세요!'); return; }
    const characterId = charSel.value;

    const partySize = parseInt(partySel.value) || 1;

    let count = state.tasks.filter(t => t.isBoss && t.characterId === characterId && isWeeklyBoardId(t.categoryId)).length;
    if (bossModalState.taskId) {
      const editing = state.tasks.find(t => t.id === bossModalState.taskId);
      if (editing && editing.characterId === characterId) count -= 1;

  function startEditCharacterName(ev, charId) {
    ev.stopPropagation();
    const el = document.getElementById('charName_' + charId);
    if (!el) return;
    const character = state.characters.find(c => c.id === charId);
    if (!character) return;
    el.contentEditable = 'true';
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let finished = false;
    function finish(save) {
      if (finished) return;
      finished = true;
      el.removeEventListener('blur', onBlur);
      el.removeEventListener('keydown', onKeydown);
      el.contentEditable = 'false';
      if (save) {
        const text = el.textContent.trim();
        if (text) { character.name = text; saveState(); }
      }
      render();
    }
    function onBlur() { finish(true); }
    function onKeydown(e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    }
    el.addEventListener('blur', onBlur);
    el.addEventListener('keydown', onKeydown);
  }

  function startEditTask(ev, taskId) {
    ev.stopPropagation();
    const el = document.getElementById('taskText_' + taskId);
    if (!el) return;
    el.contentEditable = 'true';
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let finished = false;
    function finish(save) {
      if (finished) return;
      finished = true;
      el.removeEventListener('blur', onBlur);
      el.removeEventListener('keydown', onKeydown);
      el.contentEditable = 'false';
      if (save) {
        const text = el.textContent.trim();
        if (text) {
          const task = state.tasks.find(t => t.id === taskId);
          if (task) { task.text = text; saveState(); }
        }
      }
      render();
    }
    function onBlur() { finish(true); }
    function onKeydown(e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    }
    el.addEventListener('blur', onBlur);
    el.addEventListener('keydown', onKeydown);
  }

  function startEditTaskTime(ev, taskId) {
    ev.stopPropagation();
    const el = document.getElementById('taskTime_' + taskId);
    if (!el) return;
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) return;
    el.contentEditable = 'true';
    el.textContent = String(task.time);
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let finished = false;
    function finish(save) {
      if (finished) return;
      finished = true;
      el.removeEventListener('blur', onBlur);
      el.removeEventListener('keydown', onKeydown);
      el.contentEditable = 'false';
      if (save) {
        const raw = el.textContent.trim();
        const time = parseInt(raw);
        if (!isNaN(time) && time >= 0) { task.time = time; saveState(); }
      }
      render();
    }
    function onBlur() { finish(true); }
    function onKeydown(e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      else if (!/[0-9]/.test(e.key) && !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) {
        e.preventDefault();
      }
    }
    el.addEventListener('blur', onBlur);
    el.addEventListener('keydown', onKeydown);
  }

  function renderExp() {
    const { total, done } = themeTotals('weekly');
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('totalFigure').textContent = formatHM(total);
    document.getElementById('totalSub').textContent = `완료 ${formatHM(done)} / 전체 ${formatHM(total)} (주간 컨텐츠 기준)`;
    document.getElementById('totalFill').style.width = pct + '%';
    document.getElementById('totalPct').textContent = pct + '%';

    const { earned, potential } = weeklyBossTotals();
    const bossSub = document.getElementById('bossSub');
    bossSub.textContent = potential > 0 ? `💰 이번 주 결정석 수익 ${formatMeso(earned)} / ${formatMeso(potential)}` : '';
  }

  function boardCardHtml(cat) {
    const catTasks = state.tasks.filter(t => t.categoryId === cat.id);
    const isMemo = cat.theme === 'memo';
    const realTasks = catTasks.filter(t => !t.isDivider);
    const catTotal = realTasks.reduce((s, t) => s + t.time, 0);
    const catDone = realTasks.filter(t => t.completed).reduce((s, t) => s + t.time, 0);
    const catPct = catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0;
    const color = THEME_META[cat.theme].color;
    const isWeekly = cat.theme === 'weekly';
    const panelOpen = openBossPanels.has(cat.id);
    const bossTasks = realTasks.filter(t => t.isBoss);
    const bossEarned = bossTasks.filter(t => t.completed).reduce((s, t) => s + t.price, 0);
    const bossPotential = bossTasks.reduce((s, t) => s + t.price, 0);

    let tasksHtml = '';
    if (catTasks.length === 0) {
      tasksHtml = `<div class="empty-state">${isMemo ? '아직 메모가 없어요.' : '아직 등록된 할 일이 없어요.'}</div>`;
    } else {
      tasksHtml = catTasks.map(task => {
        if (task.isDivider) {
          return `
        <li class="task-divider ${panelOpen ? 'editable' : ''}" data-id="${task.id}">
          <span class="divider-line"></span>
          ${panelOpen ? `
          <div class="row-hover-actions">
            <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})" title="구분선 삭제">&times;</button>
          </div>
          ` : ''}
        </li>`;
        }
        const character = task.characterId ? state.characters.find(c => c.id === task.characterId) : null;

        if (task.isBoss) {
          const diffColor = DIFFICULTY_COLORS[task.bossDifficulty] || 'var(--accent)';
          return `
        <li class="task-item boss-item ${task.completed ? 'completed' : ''} ${panelOpen ? 'editable' : ''}"
            style="--chip-accent: ${color};"
            onclick="toggleTask(${task.id})"
            data-id="${task.id}">
          <div class="task-left">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${task.id})">
            <span class="difficulty-badge" style="background:${diffColor}">${task.bossDifficulty}</span>
            <span class="task-text">${escapeHtml(task.bossName)}</span>
          </div>
          <div class="task-meta">
            <span class="task-char">${character ? escapeHtml(character.name) : '-'}</span>
            <span class="boss-price">${formatMeso(task.price)}${task.partySize > 1 ? ` (${task.partySize}인)` : ''}</span>
          </div>
          ${panelOpen ? `
          <div class="row-hover-actions">
            <button class="row-add-btn" title="보스 수정" onclick="event.stopPropagation(); openBossModal('${cat.id}', ${task.id})">✎</button>
            <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})">&times;</button>
          </div>
          ` : ''}
        </li>`;
        }

        const charChipHtml = character
          ? `<span class="task-char">${escapeHtml(character.name)}</span>`
          : `<span class="task-char chip-placeholder">-</span>`;
        const timeChipHtml = !isMemo
          ? (task.time > 0
              ? `<span class="task-time" id="taskTime_${task.id}" onclick="if(this.isContentEditable){event.stopPropagation();}else if(${panelOpen}){startEditTaskTime(event, ${task.id});}">${formatHM(task.time)}</span>`
              : `<span class="task-time chip-placeholder">0분</span>`)
          : '';
        const metaHtml = (!character && !isMemo && task.time > 0)
          ? timeChipHtml + charChipHtml
          : charChipHtml + timeChipHtml;
        return `
        <li class="task-item ${task.completed ? 'completed' : ''} ${panelOpen ? 'editable' : ''}"
            style="--chip-accent: ${color};"
            onclick="toggleTask(${task.id})"
            data-id="${task.id}">
          <div class="task-left">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${task.id})">
            <span class="task-text" id="taskText_${task.id}" onclick="if(this.isContentEditable){event.stopPropagation();}else if(${panelOpen}){startEditTask(event, ${task.id});}">${escapeHtml(task.text)}</span>
          </div>
          <div class="task-meta">
            ${metaHtml}
          </div>
          ${panelOpen ? `
          <div class="row-hover-actions">
            ${(isWeekly && character) ? `<button class="row-add-btn" title="${escapeHtml(character.name)} 보스 추가" onclick="event.stopPropagation(); openBossModal('${cat.id}', null, '${character.id}')">+</button>` : ''}
            <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})">&times;</button>
          </div>
          ` : ''}
        </li>`;
      }).join('');
    }

    return `
      <div class="card board" data-id="${cat.id}">
        <div class="board-header">
          <div class="board-name-wrap">
            <span class="board-dot" style="background:${color}"></span>
            <span class="board-name" contenteditable="true" spellcheck="false" id="boardName_${cat.id}">${escapeHtml(cat.name)}</span>
          </div>
          <div class="board-header-actions">
            <button class="mark-all-btn" onclick="markAllComplete('${cat.id}')">모두 완료</button>
            <button class="boss-settings-btn" title="편집" onclick="toggleBossPanel('${cat.id}')">🛠️</button>
            <button class="board-delete" title="목록 삭제" onclick="deleteBoard('${cat.id}')">🗑</button>
          </div>
        </div>
        ${!isMemo ? `
          <div class="board-progress-track"><div class="board-progress-fill" style="width:${catPct}%"></div></div>
          <div class="board-progress-label">완료 ${formatHM(catDone)} / ${formatHM(catTotal)} (${catPct}%)</div>
        ` : ''}
        ${(isWeekly && bossTasks.length > 0) ? `
          <div class="board-boss-summary">💰 결정석 수익 ${formatMeso(bossEarned)} / ${formatMeso(bossPotential)}</div>
        ` : ''}
        <ul class="board-tasks">${tasksHtml}</ul>
        <button class="add-divider-btn" onclick="addDivider('${cat.id}')" title="구분선 추가">— 구분선 추가 —</button>
        <div class="boss-panel" id="bossPanel_${cat.id}" style="display:${openBossPanels.has(cat.id) ? 'block' : 'none'};">
          ${isWeekly ? `
          <button class="boss-form-toggle" onclick="openBossModal('${cat.id}', null)">+ 보스 등록</button>
          ` : `
          <div class="edit-hint">✏️ 편집 모드예요. 이름이나 시간을 클릭하면 바로 수정할 수 있어요.</div>
          `}
        </div>
        <div class="board-add-row">
          <input type="text" id="taskInput_${cat.id}" placeholder="${isMemo ? '메모 입력' : '할 일 입력'}">
          ${!isMemo ? `<input type="number" id="timeInput_${cat.id}" placeholder="분(0 가능)" min="0">` : ''}
          <select id="charSelect_${cat.id}">${charOptionsHtml()}</select>
          <button onclick="addTask('${cat.id}')">추가</button>
        </div>
      </div>
    `;
  }

  function attachBoardListeners(cat) {
    const nameEl = document.getElementById('boardName_' + cat.id);
    if (nameEl) {
      nameEl.addEventListener('blur', () => commitBoardName(cat.id, nameEl));
      nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); } });
    }
    const taskInputEl = document.getElementById('taskInput_' + cat.id);
    if (taskInputEl) taskInputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(cat.id); });
    const timeInputEl = document.getElementById('timeInput_' + cat.id);
    if (timeInputEl) timeInputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(cat.id); });
  }

  function renderThemeSections() {
    const container = document.getElementById('themeSections');
    container.innerHTML = '';

    THEME_ORDER.forEach(themeKey => {
      const meta = THEME_META[themeKey];
      const boards = state.categories.filter(c => c.theme === themeKey);
      let badgeHtml = '';
      if (themeKey === 'daily' || themeKey === 'monthly') {
        const { total, done } = themeTotals(themeKey);
        badgeHtml = `<span class="theme-badge">완료 ${formatHM(done)} / ${formatHM(total)}</span>`;
      }

      const section = document.createElement('div');
      section.className = 'theme-section';
      section.innerHTML = `
        <div class="theme-section-header">
          <span class="theme-dot" style="background:${meta.color}"></span>
          <h3>${meta.label}</h3>
          ${badgeHtml}
        </div>
        <div class="board-grid" id="grid_${themeKey}"></div>
      `;
      container.appendChild(section);

      const grid = section.querySelector('#grid_' + themeKey);
      boards.forEach(cat => {
        grid.insertAdjacentHTML('beforeend', boardCardHtml(cat));
        attachBoardListeners(cat);
      });

      const addCard = document.createElement('div');
      addCard.className = 'add-board';
      addCard.textContent = '+ 새 목록 추가';
      addCard.onclick = () => addBoard(themeKey);
      grid.appendChild(addCard);
    });
  }

  function render() {
    renderCharacters();
    renderExp();
    renderThemeSections();
  }

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  loadState();
</script>

</body>
</html>
